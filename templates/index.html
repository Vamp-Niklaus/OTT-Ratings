{% extends 'base.html' %}

{% block title %}Web-Series{% endblock title %}

{% block body %}

<div class="container-fluid px-4 media-container" id="media-grid">
    {% include 'partials/media_cards.html' %}
</div>

<div id="loading-spinner" class="text-center my-4 d-none">
    <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div id="scroll-anchor"></div>

<script>
    let currentPage = 1;
    let isLoading = false;
    let endOfData = false;

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && !isLoading && !endOfData) {
            loadMore();
        }
    }, { rootMargin: "200px" });

    observer.observe(document.getElementById('scroll-anchor'));

    function loadMore() {
        isLoading = true;
        currentPage++;
        
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('page', currentPage);
        const nextUrl = window.location.pathname + '?' + urlParams.toString();

        document.getElementById('loading-spinner').classList.remove('d-none');

        fetch(nextUrl, {
            headers: {
                "X-Requested-With": "XMLHttpRequest"
            }
        })
        .then(response => {
            if (response.ok) return response.text();
            throw new Error("Failed to fetch");
        })
        .then(html => {
            if (html.trim() === '') {
                endOfData = true;
            } else {
                document.getElementById('media-grid').insertAdjacentHTML('beforeend', html);
            }
        })
        .catch(err => {
            console.error(err);
            endOfData = true;
        })
        .finally(() => {
            isLoading = false;
            document.getElementById('loading-spinner').classList.add('d-none');
        });
    }
</script>

{% endblock body %}

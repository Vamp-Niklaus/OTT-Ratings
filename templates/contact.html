<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"  href="{% static 'season.css' %}">
</head>
<body>

    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        <strong>Message:</strong> {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}

    <section class="vh-100 cinematic-bg">
        <div class="container py-5 h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
             <div class="col-12 col-md-8 col-lg-6 col-xl-5">
              <div class="card bg-dark text-white" style="border-radius: 1rem;">
                <div class="card-body p-4 p-md-5">
                  <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2 text-center">Contact Us</h3>

                  <form class="px-md-2" method="post" action="/contact">
                        {% csrf_token %}

                    <div class="form-outline mb-4">
                      <input type="text" id="number" class="form-control" name='number' required>
                      <label class="form-label" for="number" >Phone Number</label>
                    </div>

                    <div class="form-outline mb-4">
                        <textarea id="reason" class="form-control" name="reason" rows="4" required></textarea>
                        <label class="form-label" for="reason">Your reason to contact us</label>
                    </div>
      
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg mb-1 w-100">Submit</button>
                    </div>
                    
                    <h5 class="mt-4 text-center">
                        <a href ="/" class="text-white fw-bold" style="text-decoration-line: none;">Return Home</a>
                   </h5> 
        
                  </form>
      
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

</body>
</html>

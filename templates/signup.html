<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"  href="{% static 'season.css' %}">
</head>
<body>

    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        <strong>Message:</strong> {{ message }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
    </div>
    {% endfor %}

    <section class="h-100 cinematic-bg">
        <div class="container py-5 h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
             <div class="col-12 col-md-8 col-lg-6 col-xl-5">
              <div class="card bg-dark text-white" style="border-radius: 1rem;">
                <div class="card-body p-4 p-md-5">
                  <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Register your account here!</h3>

                  <form class="px-md-2" method="post" action="/signup">
                        {% csrf_token %}

                    <div class="form-outline mb-4">
                      <input type="text" id="username" class="form-control" name='username' required>
                      <label class="form-label" for="username" >Username</label>
                    </div>

                    <div class="form-outline mb-4">
                        <input type="password" id="pass1" class="form-control" name="pass1" required>
                        <label class="form-label" for="pass1">Password</label>
                    </div>
      
                    <button type="submit" class="btn btn-primary btn-lg mb-1">Submit</button>
                    <h5 class="mt-4">Have already an account ?
                        <a href ="/signin" class="text-white fw-bold" style="text-decoration-line: none;text-align:center">Login here</a>
                   </h5> 
        
                  </form>
      
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>




</body>
</html>
